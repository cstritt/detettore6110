{% set name = "detettore6110" %}
{% set version = "0.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/cstritt/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: PLACEHOLDER_SHA256  # Update after creating release

build:
  number: 0
  noarch: python
  entry_points:
    - detettore6110 = detettore6110.entry_point:main
    - detettore6110-find = detettore6110.find:main
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools
  run:
    - python >=3.9
    - biopython >=1.84
    - pysam >=0.22.0
    - pandas >=2.0.0
    - scikit-learn >=1.0.0
    - numpy >=1.20.0
    - scipy >=1.15.0
    - mafft
    - minimap2
    - samtools
    - cd-hit
    - seqtk

test:
  imports:
    - detettore6110
    - detettore6110.lib
  commands:
    - detettore6110 --help
    - detettore6110 find --help
    - detettore6110 summarize --help

about:
  home: https://github.com/cstritt/detettore6110
  summary: Detect and characterize insertion sequence polymorphisms and copy numbers in bacterial genomes without using a reference genome
  description: |
    detettore6110 is a tool to detect and characterize insertion sequence 
    polymorphisms and copy numbers in bacterial genomes without using a 
    reference genome. It was developed for the study of IS6110 in 
    Mycobobacterium tuberculosis, but is in principle applicable to any IS 
    in any species.
    
    Polymorphisms are characterized by the sequence of the region flanking 
    an insertion (the "anchor" sequence) rather than a reference-based insertion 
    location. Anchors can optionally be mapped against the reference to obtain 
    the subset of polymorphisms with clear reference insertion signatures.
  license: GPL-3.0
  license_file: LICENSE
  doc_url: https://github.com/cstritt/detettore6110
  dev_url: https://github.com/cstritt/detettore6110

extra:
  recipe-maintainers:
    - cstritt
